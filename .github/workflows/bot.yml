name: Trading Bot
on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot check
        env:
          BOT_SYMBOLS: "XBTUSD|BTC/USDT,PAXGUSD|GOLD (PAXG)"
          BOT_INTERVAL: "1m"
          BOT_LOOKBACK_BARS: "80"
          BOT_WEEKEND_FILTER: "1"
          BOT_WEEKEND_FILTER_SYMBOLS: "PAXGUSD"
          BOT_FAST_ENTRY: "1"
          BOT_HOURLY_UPDATE_MINUTES: "60"
          BOT_MAX_CONSECUTIVE_LOSSES: "3"
          BOT_CIRCUIT_BREAKER_PAUSE_HOURS: "4"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_action.py
      - name: Save bot state
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && exit 0
          git commit -m "Update bot state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort || true
            sleep 3
          done
          exit 1
