name: Trading Bot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot check
        env:
          BOT_SYMBOLS: "XBTUSD|BTC/USDT,XAUUSD|GOLD (XAU/USD)"
          BOT_INTERVAL: "1m"
          BOT_LOOKBACK_BARS: "80"
          BOT_WEEKEND_FILTER: "1"
          BOT_WEEKEND_FILTER_SYMBOLS: "XAUUSD"
          BOT_FAST_ENTRY: "1"
          BOT_SCALP_MODE: "1"
          BOT_SCALP_SYMBOLS: "XBTUSD,XAUUSD"
          BOT_SCALP_SL_ATR: "0.8"
          BOT_SCALP_TP_R: "1.2,1.8,2.5"
          BOT_SCALP_MAX_MINUTES: "20"
          BOT_HOURLY_UPDATE_MINUTES: "60"
          BOT_MAX_CONSECUTIVE_LOSSES: "3"
          BOT_CIRCUIT_BREAKER_PAUSE_HOURS: "4"
          # سرفر الأسعار اللحظي (WebSocket) للبيتكوين + حلقة فحص أسرع. لو واقف البوت يرجع لـ REST.
          BOT_PRICE_SERVER_URL: "http://127.0.0.1:8765"
          BOT_PRICE_SERVER_MAX_AGE: "5"
          PRICE_SERVER_SYMBOLS: "XBTUSD"
          BOT_LOOP_SECONDS: "15"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # حلقة داخل نفس التشغيل: فحص كل دقيقة لمدة ~5س40د بدل الاعتماد على cron
          # (GitHub يبطّئ cron لاحقاً إلى مرة كل ~3 ساعات)
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          save_state() {
            git add state.json
            git diff --staged --quiet && return 0
            git commit -q -m "Update bot state [skip ci]"
            for i in 1 2 3; do
              git pull -q --rebase -X theirs origin main && git push -q && return 0
              git rebase --abort || true
              sleep 3
            done
            return 0
          }
          # سرفر الأسعار اللحظي في الخلفية (لو وقع، البوت يستعمل REST تلقائياً)
          python price_server.py > price_server.log 2>&1 &
          PS_PID=$!
          trap 'kill $PS_PID 2>/dev/null || true' EXIT
          sleep 2
          LOOP=${BOT_LOOP_SECONDS:-60}
          END=$((SECONDS + 20400))
          LAST=$SECONDS
          while [ $SECONDS -lt $END ]; do
            T0=$SECONDS
            python bot_action.py || true
            if [ $((SECONDS - LAST)) -ge 300 ]; then save_state; LAST=$SECONDS; fi
            D=$((LOOP - (SECONDS - T0)))
            [ $D -gt 0 ] && sleep $D
          done
          save_state
      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main || true
